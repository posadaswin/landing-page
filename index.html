<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
</head>
<body>
    <!-- body parts (header, content, and footer) -->
    <div class="header">
        <!-- header parts (logo, list) -->
        <div class="logo">
            <img src="#" alt="Header Logo">
        </div>
        <ul class="list">
            <li><a href="#">Header link one</a></li>
            <li><a href="#">Header link two</a></li>
            <li><a href="#">Header link three</a></li>
        </ul>
    </div>
    <!-- content parts (hero, second, third, and fourth) -->
    <div class="content">
        <div class="hero">
            <!-- hero parts (section, and image) -->
            <div class="section">
                <!-- section parts (head, desc, and button) -->
                <div class="head"></div>
                <div class="desc"></div>
                <button>Sign up</button>
            </div>
            <div class="image">
                <img src="#" alt="this is a placeholder for image">
            </div>
        </div>
    </div>
    <!-- footer parts (footer itself) -->
    <div class="footer"></div>
</body>
</html>
